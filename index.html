<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мои деньги">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Мои деньги</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--line:#e5e5ea;--green:#1f9d55;--greenbg:#e3f5ea;--red:#e0342b;--redbg:#fde7e6;--orange:#d97706;--orangebg:#fdf1dc;--accent:#0a7aff;--accentbg:#e5f0ff;--chip:#e4e4ea;--shadow:0 1px 2px rgba(0,0,0,.05);--bar:rgba(255,255,255,.9)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#98989f;--line:#2c2c2e;--green:#30d158;--greenbg:#12301d;--red:#ff453a;--redbg:#3a1614;--orange:#ff9f0a;--orangebg:#3a2a0e;--accent:#0a84ff;--accentbg:#0b2440;--chip:#2c2c2e;--shadow:none;--bar:rgba(28,28,30,.92)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:17px;-webkit-text-size-adjust:100%;line-height:1.3}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit}
main{max-width:600px;margin:0 auto;padding:6px 16px 26px}
h1{font-size:32px;margin:10px 4px 12px;font-weight:700;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:24px 6px 8px}
.muted{color:var(--muted)}.pos{color:var(--green)}.neg{color:var(--red)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.list{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:58px;width:100%;text-align:left}
.row:last-child{border-bottom:none}
button.row:active{background:var(--chip)}
.grow{flex:1;min-width:0}
.row .t{font-weight:600}.row .s{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:24px;flex:none}
.ic{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;font-size:17px}
.ic.soft{background:var(--chip);color:var(--text);font-size:19px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.balance-label{color:var(--muted);font-size:15px}
.balance{font-size:40px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-word}
.subbal{display:flex;gap:16px;margin-top:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.subbal b{color:var(--text);font-variant-numeric:tabular-nums}
.mswitch{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.mswitch button{width:46px;height:46px;border-radius:23px;background:var(--card);color:var(--accent);font-size:26px;line-height:1;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.mswitch .m{font-size:19px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-word}
.grid3 .stat{padding:12px}.grid3 .val{font-size:16px}
.net{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.net .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.big-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.big{height:64px;border-radius:16px;font-size:21px;font-weight:700;color:#fff;text-align:center}
.big:active{opacity:.8}
.big.inc{background:var(--green)}.big.exp{background:var(--red)}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;margin-top:8px;width:100%;text-align:left}
.alert .ai{font-size:22px;flex:none}
.alert .t{font-weight:600}.alert .s{font-size:14px;margin-top:2px;opacity:.85}
.alert.o{background:var(--orangebg)}.alert.r{background:var(--redbg)}.alert.b{background:var(--accentbg)}.alert.g{background:var(--greenbg)}
.alert .act{flex:none;font-weight:700;color:#fff;background:var(--accent);padding:9px 12px;border-radius:11px;font-size:15px}
.alert .act.g{background:var(--green)}.alert .act.l{background:var(--card);color:var(--muted)}
.pbar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.day{font-size:14px;color:var(--muted);margin:18px 6px 6px;display:flex;justify-content:space-between;gap:8px}
.empty{text-align:center;color:var(--muted);padding:26px 16px;line-height:1.45}
.empty .e{font-size:40px;margin-bottom:4px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;color:var(--muted);font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;text-align:center}
.tab svg{width:27px;height:27px}
.tab.active{color:var(--accent)}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-size:15px;font-weight:500;text-align:center}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:600}
.filters{display:grid;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:block;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 12px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--accent)}
textarea.field{padding:10px 12px;min-height:80px}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date].field{line-height:48px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.totals{margin:10px 6px 0;font-size:14px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--card);color:var(--accent);font-size:17px;font-weight:600;padding:0 14px;box-shadow:var(--shadow);text-align:center}
.btn:active{opacity:.7}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.green{background:var(--green);color:#fff;box-shadow:none}
.btn.danger{color:var(--red)}
.btn.small{width:auto;min-height:42px;font-size:15px}
.btns{display:grid;gap:8px;margin-top:10px}.btns.two{grid-template-columns:1fr 1fr}
.hint{font-size:13px;color:var(--muted);margin:8px 6px 0;line-height:1.45}
/* reports */
.brow{margin:12px 0}
.brow .top{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.brow .top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:10px;border-radius:5px;background:var(--chip);margin-top:6px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:5px}
.pie-wrap{display:flex;align-items:center;gap:18px}
.pie-wrap svg{width:140px;height:140px;flex:none}
.legend{flex:1;min-width:0;font-size:15px}
.legend div{display:flex;align-items:center;gap:8px;margin:6px 0}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:360px){.pie-wrap{flex-direction:column;align-items:stretch}.pie-wrap svg{margin:0 auto}}
.cols{display:flex;align-items:flex-end;justify-content:space-between;height:150px;gap:4px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.col .bars{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.col .b{width:42%;max-width:14px;border-radius:3px 3px 0 0;min-height:2px}
.col .lb{font-size:11px;color:var(--muted);margin-top:6px}
.col.cur .lb{color:var(--text);font-weight:700}
.cmp-legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:10px}
.cmp-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ctable{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.ctable td,.ctable th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right}
.ctable th{color:var(--muted);font-weight:500;font-size:13px}
.ctable td:first-child,.ctable th:first-child{text-align:left}
.ctable tr:last-child td{border-bottom:none}
.ctable tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.kpi{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.kpi:last-child{border-bottom:none}
.kpi b{font-variant-numeric:tabular-nums}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:600px;margin:0 auto;padding:0 16px calc(22px + env(safe-area-inset-bottom))}
.panel.anim{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.shh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -16px;padding:8px 16px 8px;border-bottom:1px solid var(--line)}
.shh::before{content:'';position:absolute;top:6px;left:50%;width:40px;height:5px;border-radius:3px;background:var(--muted);opacity:.35;transform:translateX(-50%)}
.shh b{font-size:17px;text-align:center;flex:1;padding-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{color:var(--accent);font-size:17px;padding:16px 4px 6px;min-width:70px}
.lb.r{text-align:right;font-weight:600}
.shb{padding-top:8px}
.fl{display:block;font-size:13px;color:var(--muted);margin:16px 6px 6px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);color:var(--text);padding:0 15px;min-height:44px;border-radius:22px;font-size:16px;border:1.5px solid var(--line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips.income .chip.on{background:var(--green);border-color:var(--green)}
.chips.expense .chip.on{background:var(--red);border-color:var(--red)}
.tseg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:0}
.tseg .chip{flex:1;border:none;background:none;border-radius:10px;font-weight:600}
.tseg .chip.on[data-v=income]{background:var(--green);color:#fff}
.tseg .chip.on[data-v=expense]{background:var(--red);color:#fff}
.amount-box{background:var(--card);border-radius:16px;margin:12px 0 4px;display:flex;align-items:center;padding:0 16px}
.amount-input{flex:1;min-width:0;border:none;background:transparent;font-size:40px;font-weight:700;text-align:center;color:var(--text);padding:12px 0;outline:none}
.amount-box .cur{font-size:22px;color:var(--muted);font-weight:600}
.save{margin-top:18px;width:100%;height:56px;border-radius:16px;color:#fff;font-size:19px;font-weight:700;text-align:center;background:var(--accent)}
.save.income{background:var(--green)}.save.expense{background:var(--red)}
.box{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px}
.box.warn{background:var(--orangebg)}.box.bad{background:var(--redbg)}.box.good{background:var(--greenbg)}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,40,42,.96);color:#fff;padding:12px 20px;border-radius:24px;font-size:15px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
.xbtn{width:36px;height:36px;border-radius:18px;background:var(--chip);color:var(--red);font-size:20px;flex:none;text-align:center}
.inrow{display:flex;gap:8px;align-items:center}
.inrow .field{flex:1}
/* lock */
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;align-items:center;justify-content:center}
.lock.show{display:flex}
.lki{text-align:center;width:300px}
.lki .t{font-size:20px;font-weight:600;margin:10px 0 18px}
.dots{display:flex;gap:18px;justify-content:center;margin-bottom:8px}
.dots i{width:15px;height:15px;border-radius:8px;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.lkerr{color:var(--red);height:22px;font-size:15px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 14px}
.pad button{height:72px;border-radius:36px;background:var(--card);box-shadow:var(--shadow);font-size:28px;text-align:center}
.pad button:active{background:var(--chip)}
.pad button.nb{background:none;box-shadow:none;font-size:22px}
/* report */
.report{position:fixed;inset:0;z-index:90;background:#e8e8ed;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.report.show{display:block}
.rpbar{position:sticky;top:0;display:flex;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#e8e8ed;z-index:2}
.rpbar button{background:#fff;color:#0a7aff;font-weight:600;border-radius:12px;padding:0 16px;min-height:44px;font-size:16px}
.rpbar button.pr{background:#0a7aff;color:#fff}
.rp{background:#fff;color:#1c1c1e;max-width:820px;margin:0 auto 40px;padding:26px 22px;font-size:13.5px;line-height:1.4}
.rp h1{font-size:22px;margin:0 0 2px}
.rp h3{font-size:14px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid #1c1c1e;text-transform:uppercase;letter-spacing:.04em}
.rp .rs{color:#555}
.rp table{width:100%;border-collapse:collapse;margin:4px 0;font-variant-numeric:tabular-nums}
.rp td,.rp th{border-bottom:1px solid #e2e2e6;padding:5px 6px;text-align:left;vertical-align:top}
.rp th{font-size:11.5px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.rp td.r,.rp th.r{text-align:right;white-space:nowrap}
.rp tr.tot td{font-weight:700;border-top:2px solid #1c1c1e;border-bottom:none}
.rp .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.rp .kp div{border:1px solid #e2e2e6;border-radius:8px;padding:8px 10px}
.rp .kp span{display:block;font-size:11px;color:#666;text-transform:uppercase}
.rp .kp b{font-size:16px;font-variant-numeric:tabular-nums}
.rp .g{color:#1a7f45}.rp .rd{color:#c62828}
.rp .rf{color:#888;font-size:11.5px;margin-top:22px}
@media (max-width:560px){.rp .kp{grid-template-columns:1fr 1fr}.rp{padding:18px 12px;font-size:12.5px}.rp td,.rp th{padding:5px 3px}.rp th{font-size:10.5px}}
@media print{
  body{background:#fff;padding:0}
  main,.tabbar,.sheet,.toast,.lock,.noprint{display:none!important}
  .report{position:static;display:block!important;overflow:visible;background:#fff}
  .rp{margin:0;padding:0;max-width:none}
  .rp h3,.rp table{page-break-inside:auto}.rp tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<main id="main"></main>

<nav class="tabbar">
  <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>Главная</button>
  <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>История</button>
  <button class="tab" data-tab="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Отчёты</button>
  <button class="tab" data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16.5 14.6c2.3 0 3.7 1.5 4.1 4"/></svg>Клиенты</button>
  <button class="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Ещё</button>
</nav>

<div class="sheet" id="sheet"><div class="backdrop" data-act="closeSheet"></div><div class="panel" id="panel"></div></div>
<div class="report" id="report"></div>
<div class="toast" id="toast"></div>
<div class="lock" id="lock"><div class="lki">
  <div style="font-size:44px">🔒</div>
  <div class="t" id="lkTitle">Введите PIN-код</div>
  <div class="dots" id="lkDots"><i></i><i></i><i></i><i></i></div>
  <div class="lkerr" id="lkErr"></div>
  <div class="pad" id="lkPad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="nb"></button><button data-k="0">0</button><button class="nb" data-k="del">⌫</button>
  </div>
  <button class="lb" id="lkAlt" style="text-align:center;width:100%">Забыли PIN?</button>
</div></div>
<input type="file" id="impFile" accept=".json,.csv,application/json,text/csv,text/plain" hidden>

<script>
(function(){
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s),$$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoDate(new Date());
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const dim=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const monthEnd=m=>m+'-'+pad(dim(m));
const shiftMonth=(m,k)=>{let y=+m.slice(0,4),mm=+m.slice(5,7)+k;while(mm<1){mm+=12;y--;}while(mm>12){mm-=12;y++;}return y+'-'+pad(mm);};
const fmtD=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WEEK=['вс','пн','вт','ср','чт','пт','сб'];
const monthLabel=m=>MONTHS[+m.slice(5,7)-1]+' '+m.slice(0,4);
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;};
const nf=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const money=n=>nf.format(r2(n))+' сом';
const signed=n=>(n>=0?'+':'−')+money(Math.abs(n));
const shortN=n=>{const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' млн';if(a>=1e4)return Math.round(n/1e3)+' тыс';return nf.format(Math.round(n));};
const num=s=>{if(s==null)return null;s=String(s).replace(/[\s ]/g,'').replace(',','.');if(s==='')return null;const n=parseFloat(s);return isFinite(n)?n:null;};
const PALETTE=['#ff6b5b','#ff9f0a','#ffcc00','#30b0c7','#5e5ce6','#bf5af2','#ff375f','#64d2ff','#a2845e','#34c759','#8e8e93'];
const DEFAULT_CATS={income:['Зарплата','Отправка тканей','Прочее'],expense:['Продукты','Транспорт','Связь','Коммуналка','Ткани/закупка','Прочее']};
const isFabric=t=>t.type==='income'&&/ткан/i.test(t.cat||'');

/* ============ storage ============ */
const KEY='moneyApp_v1';
function migrate(s){
  if(!s||!Array.isArray(s.tx))s={tx:[]};
  if(!s.cats||!Array.isArray(s.cats.income)||!Array.isArray(s.cats.expense))s.cats=clone(DEFAULT_CATS);
  s.clients=Array.isArray(s.clients)?s.clients:[];
  s.budgets=s.budgets&&typeof s.budgets==='object'&&!Array.isArray(s.budgets)?s.budgets:{};
  s.recurring=Array.isArray(s.recurring)?s.recurring:[];
  s.goals=Array.isArray(s.goals)?s.goals:[];
  s.settings=Object.assign({pin:null,lastBackup:null,backupNag:0},s.settings||{});
  s.recurring.forEach(r=>{r.done=r.done||{};});
  s.goals.forEach(g=>{g.items=g.items||[];});
  s.tx=s.tx.filter(t=>t&&t.date&&+t.amount>0);
  s.tx.forEach(t=>{t.amount=+t.amount;if(t.cost!=null&&t.cost!=='')t.cost=+t.cost;else t.cost=null;});
  s.v=2;return s;
}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}return migrate(s);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){alert('Не удалось сохранить данные на телефоне. Проверьте свободное место.');}}
let state=load();save();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ============ model ============ */
const client=id=>state.clients.find(c=>c.id===id);
const cname=id=>{const c=client(id);return c?c.name:'';};
const sorted=list=>(list||state.tx).slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.created||0)-(a.created||0));
function totals(list){let inc=0,exp=0;list.forEach(t=>{if(t.type==='income')inc+=t.amount;else exp+=t.amount;});return {inc,exp,net:inc-exp};}
const inRange=(from,to)=>state.tx.filter(t=>t.date>=from&&t.date<=to);
const inMonth=m=>state.tx.filter(t=>t.date.slice(0,7)===m);
const groupSum=list=>{const m={};list.forEach(t=>{m[t.cat]=(m[t.cat]||0)+t.amount;});return m;};
const goalSaved=g=>g.items.reduce((s,i)=>s+i.amount,0);
function fabricStats(list){
  const f=list.filter(isFabric);let rev=0,cost=0,costKnown=0,revKnown=0;const by={};
  f.forEach(t=>{rev+=t.amount;if(t.cost!=null){cost+=t.cost;costKnown++;revKnown+=t.amount;}const k=t.client||'';(by[k]=by[k]||{id:k,n:0,rev:0,cost:0,profit:0,known:0});by[k].n++;by[k].rev+=t.amount;if(t.cost!=null){by[k].cost+=t.cost;by[k].profit+=t.amount-t.cost;by[k].known++;}});
  return {list:f,n:f.length,rev,cost,profit:revKnown-cost,costKnown,revKnown,margin:revKnown?(revKnown-cost)/revKnown*100:null,clients:Object.values(by).sort((a,b)=>b.rev-a.rev)};
}
function dueRecurring(){
  const t=today(),m=t.slice(0,7);
  return state.recurring.map(r=>{const due=m+'-'+pad(Math.min(r.day,dim(m)));return {r,m,due,st:r.done[m],diff:diffDays(t,due)};}).filter(x=>!x.st&&x.diff<=3).sort((a,b)=>a.diff-b.diff);
}
function budgetUse(m){
  return Object.keys(state.budgets).filter(c=>state.budgets[c]>0).map(c=>{const spent=inMonth(m).filter(t=>t.type==='expense'&&t.cat===c).reduce((s,t)=>s+t.amount,0);const lim=state.budgets[c];return {c,lim,spent,pct:spent/lim*100};}).sort((a,b)=>b.pct-a.pct);
}
function dateTitle(ds){
  const d=parseD(ds),t=today();const y=new Date();y.setDate(y.getDate()-1);
  let s=d.getDate()+' '+MONTHS_GEN[d.getMonth()];if(d.getFullYear()!==new Date().getFullYear())s+=' '+d.getFullYear();
  if(ds===t)return 'Сегодня, '+s;if(ds===isoDate(y))return 'Вчера, '+s;return s+', '+WEEK[d.getDay()];
}

/* ============ ui state ============ */
const ui={tab:'home',month:today().slice(0,7),year:today().slice(0,4),repMode:'month',f:{month:today().slice(0,7),type:'all',cat:'all',client:'all',q:''}};

function itemHTML(t,withDate){
  const inc=t.type==='income';let sub=[];
  if(withDate){const d=parseD(t.date);sub.push(d.getDate()+' '+MONTHS_GEN[d.getMonth()]);}
  if(t.client&&cname(t.client))sub.push('👤 '+cname(t.client));

  const p=isFabric(t)?profitOf(t):null;

  return '<button class="row" data-act="editTx" data-id="'+t.id+'"><div class="ic" style="background:var(--'+(inc?'green':'red')+')">'+esc(letter)+'</div><div class="grow"><div class="t">'+esc(t.cat)+(t.recId?' <span class="muted" style="font-weight:400">🔁</span>':'')+'</div>'+(sub.length?'<div class="s">'+esc(sub.join(' · '))+'</div>':'')+'</div><div class="amt '+(inc?'pos':'neg')+'">'+(inc?'+':'−')+money(t.amount)+(p!=null?'<small class="muted">прибыль '+nf.format(r2(p))+'</small>':'')+'</div></button>';
}
const mswitch=(act,label)=>'<div class="mswitch"><button data-act="'+act+'" data-v="-1" aria-label="Назад">‹</button><div class="m">'+label+'</div><button data-act="'+act+'" data-v="1" aria-label="Вперёд">›</button></div>';

function goalRow(g){const s=goalSaved(g),p=g.target?Math.min(100,s/g.target*100):0;return '<button class="row" data-act="openGoal" data-id="'+g.id+'"><div class="ic soft">'+esc(g.emoji||'🎯')+'</div><div class="grow"><div class="t">'+esc(g.name)+'</div><div class="s">'+money(s)+' из '+money(g.target)+' · '+Math.round(p)+'%</div><div class="pbar"><i style="width:'+p.toFixed(1)+'%;background:'+(p>=100?'var(--green)':'var(--accent)')+'"></i></div></div><span class="chev">›</span></button>';}

/* ============ HISTORY ============ */
function catsFor(type){const set=[];const add=c=>{if(c&&!set.includes(c))set.push(c);};if(type!=='expense')state.cats.income.forEach(add);if(type!=='income')state.cats.expense.forEach(add);state.tx.forEach(t=>{if(type==='all'||t.type===type)add(t.cat);});return set;}
function renderHistory(){
  const f=ui.f;
  const months=Array.from(new Set(state.tx.map(t=>t.date.slice(0,7)).concat([today().slice(0,7)]))).sort().reverse();
  if(f.month!=='all'&&!months.includes(f.month))f.month='all';
  const cats=catsFor(f.type);if(f.cat!=='all'&&!cats.includes(f.cat))f.cat='all';
  let h='<h1>История</h1><div class="filters"><input class="field" id="fq" type="search" placeholder="🔍 Поиск: клиент, комментарий, сумма…" value="'+esc(f.q)+'">'+
    '<div class="seg">'+[['all','Все'],['income','Доходы'],['expense','Расходы']].map(o=>'<button data-act="fType" data-v="'+o[0]+'" class="'+(f.type===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</div>'+
    '<div class="row2"><select class="field" id="fMonth"><option value="all">Все месяцы</option>'+months.map(m=>'<option value="'+m+'"'+(f.month===m?' selected':'')+'>'+monthLabel(m)+'</option>').join('')+'</select>'+
    '<select class="field" id="fCat"><option value="all">Все категории</option>'+cats.map(c=>'<option value="'+esc(c)+'"'+(f.cat===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'+
    (state.clients.length?'<select class="field" id="fClient"><option value="all">Все клиенты</option>'+state.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(c=>'<option value="'+c.id+'"'+(f.client===c.id?' selected':'')+'>👤 '+esc(c.name)+'</option>').join('')+'</select>':'')+
    '</div><div id="hList">'+historyList()+'</div>';

function historyList(){
  const f=ui.f,q=f.q.trim().toLowerCase();
  const list=sorted().filter(t=>(f.month==='all'||t.date.slice(0,7)===f.month)&&(f.type==='all'||t.type===f.type)&&(f.cat==='all'||t.cat===f.cat)&&(f.client==='all'||t.client===f.client)&&
    (!q||[t.cat,t.note,cname(t.client),String(t.amount),nf.format(t.amount),fmtD(t.date)].join(' ').toLowerCase().includes(q)));
  if(!list.length)return '<div class="card empty" style="margin-top:14px">Ничего не найдено</div>';
  const tt=totals(list);const parts=[];
  if(f.type!=='expense')parts.push('Доходы: <b class="pos">+'+money(tt.inc)+'</b>');
  if(f.type!=='income')parts.push('Расходы: <b class="neg">−'+money(tt.exp)+'</b>');
  let h='<div class="totals">'+parts.join(' · ')+' · '+list.length+' шт.</div>',cur=null,group=[];
  const flush=()=>{if(!group.length)return;const g=totals(group);h+='<div class="day"><span>'+dateTitle(cur)+'</span><span class="'+(g.net>=0?'pos':'neg')+'">'+signed(g.net)+'</span></div><div class="list">'+group.map(t=>itemHTML(t,false)).join('')+'</div>';group=[];};
  list.slice(0,600).forEach(t=>{if(t.date!==cur){flush();cur=t.date;}group.push(t);});flush();
  if(list.length>600)h+='<div class="hint">Показаны первые 600. Уточните фильтр.</div>';
  return h;
}

      '<div style="margin-top:8px;border-top:1px solid var(--line)">'+rows.map(r=>{const lim=mm?state.budgets[r[0]]:state.budgets[r[0]]?state.budgets[r[0]]*12:0;const p=lim?r[1]/lim*100:0;

  }

    const unused=Object.keys(state.budgets).filter(c=>state.budgets[c]>0&&!expBy[c]);
    if(unused.length)h+='<div class="hint">Без трат в этом месяце: '+esc(unused.join(', '))+'.</div>';
    const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(ui.month,-i));
    const data=ms.map(m=>{const t=totals(inMonth(m));return {k:m,l:MS[+m.slice(5)-1],inc:t.inc,exp:t.exp};});
    h+='<h2>Последние 6 месяцев</h2><div class="card">'+barsHTML(data,ui.month)+monthTable(data.slice().reverse(),false)+'</div>';
  } else {

    h+='<h2>По месяцам</h2><div class="card">'+barsHTML(data,today().slice(0,7))+monthTable(data,true)+'</div>';
    const act=data.filter(d=>d.inc||d.exp);
    if(act.length){const best=act.reduce((a,b)=>(b.inc-b.exp)>(a.inc-a.exp)?b:a),worst=act.reduce((a,b)=>b.exp>a.exp?b:a);
      h+='<div class="card" style="margin-top:8px"><div class="kpi"><span>Средний доход в месяц</span><b>'+money(T.inc/act.length)+'</b></div><div class="kpi"><span>Средний расход в месяц</span><b>'+money(T.exp/act.length)+'</b></div><div class="kpi"><span>Лучший месяц</span><b>'+MONTHS[+best.k.slice(5)-1]+' ('+signed(best.inc-best.exp)+')</b></div><div class="kpi"><span>Больше всего трат</span><b>'+MONTHS[+worst.k.slice(5)-1]+' ('+money(worst.exp)+')</b></div></div>';}
  }
  return h;
}
function monthTable(data,withTotal){
  let s='<table class="ctable" style="margin-top:12px"><tr><th>Месяц</th><th>Доходы</th><th>Расходы</th><th>Итог</th></tr>';let ti=0,te=0;
  data.forEach(d=>{const n=d.inc-d.exp;ti+=d.inc;te+=d.exp;s+='<tr><td>'+MS[+d.k.slice(5)-1]+' '+d.k.slice(2,4)+'</td><td class="pos">'+nf.format(Math.round(d.inc))+'</td><td class="neg">'+nf.format(Math.round(d.exp))+'</td><td class="'+(n>=0?'pos':'neg')+'">'+(n>=0?'+':'−')+nf.format(Math.round(Math.abs(n)))+'</td></tr>';});
  if(withTotal){const n=ti-te;s+='<tr class="tot"><td>Итого</td><td class="pos">'+nf.format(Math.round(ti))+'</td><td class="neg">'+nf.format(Math.round(te))+'</td><td class="'+(n>=0?'pos':'neg')+'">'+(n>=0?'+':'−')+nf.format(Math.round(Math.abs(n)))+'</td></tr>';}
  return s+'</table>';
}

const stack=[];let hooks={},curSave=null;
function pushSheet(fn){stack.push(fn);drawSheet(true);}
function popSheet(){stack.pop();if(stack.length)drawSheet(false);else hideSheet();renderMain();}
function closeAll(){stack.length=0;hideSheet();renderMain();}
function hideSheet(){if(document.activeElement)document.activeElement.blur();$('#sheet').classList.remove('open');hooks={};curSave=null;}
function refreshSheet(){if(stack.length&&stack[stack.length-1].detail){const p=$('#panel'),y=p.scrollTop;drawSheet(false);p.scrollTop=y;}}
const detail=fn=>{fn.detail=true;return fn;};
function drawSheet(isNew){
  const cfg=stack[stack.length-1]();if(!cfg){popSheet();return;}
  const p=$('#panel'),wasOpen=$('#sheet').classList.contains('open');hooks=cfg.hooks||{};
  p.innerHTML='<div class="shh"><button class="lb" data-act="'+(stack.length>1?'backSheet':'closeSheet')+'">'+(cfg.onSave?'Отмена':(stack.length>1?'‹ Назад':'Закрыть'))+'</button><b>'+esc(cfg.title||'')+'</b>'+(cfg.onSave?'<button class="lb r" data-act="sheetSave">'+esc(cfg.saveLabel||'Готово')+'</button>':'<span class="lb"></span>')+'</div><div class="shb">'+cfg.body+'</div>';
  curSave=cfg.onSave?async()=>{const r=await cfg.onSave();if(r!==false)popSheet();}:null;
  $('#sheet').classList.add('open');
  if(isNew){p.scrollTop=0;if(!wasOpen){p.classList.remove('anim');void p.offsetWidth;p.classList.add('anim');}}
  if(cfg.onOpen)cfg.onOpen(p);
}

/* ============ REPORT setup & PDF ============ */
function periodRange(k){
  const t=today(),y=+t.slice(0,4),m=t.slice(0,7);
  if(k==='view')return ui.repMode==='year'&&ui.tab==='reports'?[ui.year+'-01-01',ui.year+'-12-31',ui.year+' год']:[ui.month+'-01',monthEnd(ui.month),monthLabel(ui.month)];
  if(k==='m0')return [m+'-01',monthEnd(m),monthLabel(m)];
  if(k==='m1'){const p=shiftMonth(m,-1);return [p+'-01',monthEnd(p),monthLabel(p)];}
  if(k==='q'){const p=shiftMonth(m,-2);return [p+'-01',monthEnd(m),'3 месяца: '+MONTHS[+p.slice(5)-1]+' — '+MONTHS[+m.slice(5)-1]+' '+y];}
  if(k==='y0')return [y+'-01-01',y+'-12-31',y+' год'];
  if(k==='y1')return [(y-1)+'-01-01',(y-1)+'-12-31',(y-1)+' год'];
  const first=state.tx.reduce((a,x)=>x.date<a?x.date:a,t),last=state.tx.reduce((a,x)=>x.date>a?x.date:a,t);return [first,last,'Всё время'];
}
function reportSetup(kind){return ()=>{
  const viewL=periodRange('view')[2];
  return {title:kind==='xlsx'?'Выгрузка в Excel':'Отчёт PDF',saveLabel:'Создать',body:F.chips('per','Период',[['view',viewL],['m1','Прошлый месяц'],['q','3 месяца'],['y0','Этот год'],['y1','Прошлый год'],['all','Всё время'],['custom','Свой период']],'view')+
    '<div id="cust" style="display:none"><div class="row2">'+'<div>'+F.date('f_from','С',today().slice(0,8)+'01')+'</div><div>'+F.date('f_to','По',today())+'</div></div></div>'+
    (kind==='pdf'?F.chips('ops','Список всех операций в отчёте',[['yes','Включить'],['no','Без списка']],'yes'):'')+
    '<div class="hint">'+(kind==='xlsx'?'Получится файл Excel с листами: Операции, По месяцам, По категориям, Клиенты, Отправки тканей. Его можно открыть в Excel, Numbers или Google Таблицах и отправить через «Поделиться».':'Откроется готовый отчёт: итоги, доходы и расходы по категориям, бюджеты, ткани с прибылью по клиентам, помесячная таблица. Кнопка «Печать / PDF» сохранит его в PDF.')+'</div>'+
    '<button class="save" data-act="sheetSave">'+(kind==='xlsx'?'📊 Создать Excel':'📄 Открыть отчёт')+'</button>',
    hooks:{per:x=>show('cust',x==='custom')},
    onSave:()=>{const k=chipVal('per');let from,to,label;
      if(k==='custom'){from=val('f_from');to=val('f_to');if(!from||!to||from>to){alert('Проверьте даты');return false;}label=fmtD(from)+' — '+fmtD(to);}else[from,to,label]=periodRange(k);
      if(kind==='xlsx'){exportXlsx(from,to,label);}else showReport(from,to,label,chipVal('ops')!=='no');}};
};}
function showReport(from,to,label,withOps){
  const list=inRange(from,to),T=totals(list),e=esc,M=n=>nf.format(r2(n));
  const multiMonth=from.slice(0,7)!==to.slice(0,7);
  let h='<div class="rpbar noprint"><button data-act="closeReport">✕ Закрыть</button><button class="pr" data-act="printReport">Печать / PDF</button></div><div class="rp">';
  h+='<h1>Финансовый отчёт</h1><div class="rs">'+e(label)+' ('+fmtD(from)+' — '+fmtD(to)+') · составлен '+fmtD(today())+' · суммы в сомах</div>';
  h+='<div class="kp"><div><span>Доходы</span><b class="g">'+M(T.inc)+'</b></div><div><span>Расходы</span><b class="rd">'+M(T.exp)+'</b></div><div><span>Итог</span><b class="'+(T.net>=0?'g':'rd')+'">'+(T.net>=0?'+':'−')+M(Math.abs(T.net))+'</b></div><div><span>Сохранено</span><b>'+(T.inc?Math.round(T.net/T.inc*100)+'%':'—')+'</b></div></div>';
  const tbl=(type,total)=>{const by=groupSum(list.filter(t=>t.type===type));const rows=Object.keys(by).sort((a,b)=>by[b]-by[a]);if(!rows.length)return '<div class="rs">Нет</div>';
    const months=Math.max(1,(+to.slice(0,4)-+from.slice(0,4))*12+(+to.slice(5,7)-+from.slice(5,7))+1);
    const withBud=type==='expense'&&Object.keys(state.budgets).length;
    return '<table><tr><th>Категория</th><th class="r">Операций</th><th class="r">Сумма</th><th class="r">Доля</th>'+(withBud?'<th class="r">Бюджет</th><th class="r">Исполнение</th>':'')+'</tr>'+rows.map(c=>{const n=list.filter(t=>t.type===type&&t.cat===c).length;const lim=state.budgets[c]?state.budgets[c]*months:0;return '<tr><td>'+e(c)+'</td><td class="r">'+n+'</td><td class="r">'+M(by[c])+'</td><td class="r">'+Math.round(by[c]/total*100)+'%</td>'+(withBud?'<td class="r">'+(lim?M(lim):'—')+'</td><td class="r'+(lim&&by[c]>lim?' rd':'')+'">'+(lim?Math.round(by[c]/lim*100)+'%':'')+'</td>':'')+'</tr>';}).join('')+'<tr class="tot"><td>Итого</td><td class="r">'+list.filter(t=>t.type===type).length+'</td><td class="r">'+M(total)+'</td><td class="r">100%</td>'+(withBud?'<td></td><td></td>':'')+'</tr></table>';};
  h+='<h3>Доходы по категориям</h3>'+tbl('income',T.inc);
  h+='<h3>Расходы по категориям</h3>'+tbl('expense',T.exp);
  const fs=fabricStats(list);
  if(fs.n){
    h+='<h3>Ткани</h3><div class="kp"><div><span>Отправок</span><b>'+fs.n+'</b></div><div><span>Выручка</span><b>'+M(fs.rev)+'</b></div><div><span>Себестоимость</span><b>'+(fs.costKnown?M(fs.cost):'—')+'</b></div><div><span>Прибыль</span><b class="'+(fs.profit>=0?'g':'rd')+'">'+(fs.costKnown?M(fs.profit)+(fs.margin!=null?' ('+Math.round(fs.margin)+'%)':''):'—')+'</b></div></div>';
    if(fs.costKnown&&fs.costKnown<fs.n)h+='<div class="rs">Прибыль рассчитана по '+fs.costKnown+' из '+fs.n+' отправок с указанной себестоимостью.</div>';
    const purch=list.filter(t=>t.type==='expense'&&/ткан/i.test(t.cat)).reduce((s,t)=>s+t.amount,0);
    if(purch)h+='<div class="rs">Закупки тканей (расходы) за период: '+M(purch)+'</div>';
    h+='<table style="margin-top:8px"><tr><th>Клиент</th><th class="r">Отправок</th><th class="r">Выручка</th><th class="r">Себест.</th><th class="r">Прибыль</th></tr>'+fs.clients.map(c=>'<tr><td>'+e(c.id?cname(c.id)||'Удалённый':'Без клиента')+'</td><td class="r">'+c.n+'</td><td class="r">'+M(c.rev)+'</td><td class="r">'+(c.known?M(c.cost):'—')+'</td><td class="r">'+(c.known?M(c.profit):'—')+'</td></tr>').join('')+'<tr class="tot"><td>Итого</td><td class="r">'+fs.n+'</td><td class="r">'+M(fs.rev)+'</td><td class="r">'+(fs.costKnown?M(fs.cost):'—')+'</td><td class="r">'+(fs.costKnown?M(fs.profit):'—')+'</td></tr></table>';
    h+='<table style="margin-top:10px"><tr><th>Дата</th><th>Клиент / комментарий</th><th class="r">Сумма</th><th class="r">Себест.</th><th class="r">Прибыль</th></tr>'+sorted(fs.list).reverse().map(t=>'<tr><td>'+fmtD(t.date)+'</td><td>'+e(cname(t.client)||'—')+(t.note?'<br><span class="rs">'+e(t.note)+'</span>':'')+'</td><td class="r">'+M(t.amount)+'</td><td class="r">'+(t.cost!=null?M(t.cost):'—')+'</td><td class="r">'+(t.cost!=null?M(t.amount-t.cost):'—')+'</td></tr>').join('')+'</table>';
  }
  if(multiMonth){
    let m=from.slice(0,7);const rows=[];while(m<=to.slice(0,7)&&rows.length<120){const t=totals(list.filter(x=>x.date.slice(0,7)===m));rows.push([m,t]);m=shiftMonth(m,1);}
    h+='<h3>По месяцам</h3><table><tr><th>Месяц</th><th class="r">Доходы</th><th class="r">Расходы</th><th class="r">Итог</th></tr>'+rows.map(r=>'<tr><td>'+monthLabel(r[0])+'</td><td class="r">'+M(r[1].inc)+'</td><td class="r">'+M(r[1].exp)+'</td><td class="r '+(r[1].net>=0?'g':'rd')+'">'+(r[1].net>=0?'+':'−')+M(Math.abs(r[1].net))+'</td></tr>').join('')+'<tr class="tot"><td>Итого</td><td class="r">'+M(T.inc)+'</td><td class="r">'+M(T.exp)+'</td><td class="r">'+(T.net>=0?'+':'−')+M(Math.abs(T.net))+'</td></tr></table>';
  }
  if(state.goals.length)h+='<h3>Цели накопления</h3><table><tr><th>Цель</th><th class="r">Накоплено</th><th class="r">Цель</th><th class="r">%</th></tr>'+state.goals.map(g=>{const s=goalSaved(g);return '<tr><td>'+e(g.name)+'</td><td class="r">'+M(s)+'</td><td class="r">'+M(g.target)+'</td><td class="r">'+Math.round(s/g.target*100)+'%</td></tr>';}).join('')+'</table>';
  if(withOps&&list.length)h+='<h3>Все операции ('+list.length+')</h3><table><tr><th>Дата</th><th>Категория</th><th>Клиент / комментарий</th><th class="r">Сумма</th></tr>'+sorted(list).reverse().map(t=>'<tr><td>'+fmtD(t.date)+'</td><td>'+e(t.cat)+'</td><td>'+e([cname(t.client),t.note].filter(Boolean).join(' · '))+'</td><td class="r '+(t.type==='income'?'g':'rd')+'">'+(t.type==='income'?'+':'−')+M(t.amount)+'</td></tr>').join('')+'</table>';
  h+='<div class="rf">Составлено в приложении «Мои деньги».</div></div>';
  const r=$('#report');r.innerHTML=h;r.classList.add('show');r.scrollTop=0;$('#toast').classList.remove('show');

  return [{name:'Операции',rows:ops,widths:[12,10,18,14,18,15,13,36]},{name:'По месяцам',rows:months,widths:[18,14,14,14,14]},{name:'По категориям',rows:cats,widths:[10,20,11,14,10,16]},{name:'Клиенты',rows:cl,widths:[22,11,14,15,14,10,16]},{name:'Отправки тканей',rows:sh,widths:[12,22,14,15,14,36]}];
}

async function shareBlob(name,blob){
  try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}
  catch(e){if(e&&e.name==='AbortError')return false;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true;
}

  if(f!==''||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()!==''));}

async function hashPin(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('md:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=5381;for(const c of 'md:'+p)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h;}}

function showLock(mode){lk={mode,buf:'',first:''};$('#lkTitle').textContent=mode==='unlock'?'Введите PIN-код':'Придумайте PIN-код из 4 цифр';$('#lkErr').textContent='';$('#lkAlt').textContent=mode==='unlock'?'Забыли PIN?':'Отмена';drawDots();$('#lock').classList.add('show');}
function drawDots(){$$('#lkDots i').forEach((d,i)=>d.classList.toggle('on',i<lk.buf.length));}

async function lkPress(k){

  const code=lk.buf;await new Promise(r=>setTimeout(r,120));
  if(lk.mode==='unlock'){if(await hashPin(code)===state.settings.pin){$('#lock').classList.remove('show');renderMain();}else lkErr('Неверный PIN-код');}
  else if(lk.mode==='set1'){lk.first=code;lk.mode='set2';lk.buf='';$('#lkTitle').textContent='Повторите PIN-код';drawDots();}
  else{if(code===lk.first){state.settings.pin=await hashPin(code);save();$('#lock').classList.remove('show');renderMain();toast('PIN-код включён 🔒');}else{lk.mode='set1';$('#lkTitle').textContent='Придумайте PIN-код из 4 цифр';lkErr('Не совпало, попробуйте ещё раз');}}
}

  pin:()=>{if(state.settings.pin){if(confirm('Выключить PIN-код?')){state.settings.pin=null;save();renderMain();toast('PIN-код выключен');}}else showLock('set1');},
  wipe:()=>{if(!state.tx.length){toast('Операций нет');return;}if(!confirm('Удалить ВСЕ операции ('+state.tx.length+')? Это нельзя отменить.\nСовет: сначала сохраните копию.'))return;if(!confirm('Точно удалить?'))return;state.tx=[];save();renderMain();toast('Все операции удалены');},
};
document.addEventListener('click',e=>{
  const chip=e.target.closest('.chips .chip');
  if(chip){const box=chip.parentElement;$$('.chip',box).forEach(c=>c.classList.toggle('on',c===chip));const h=hooks[box.dataset.name];if(h)h(chip.dataset.v);return;}
  const tab=e.target.closest('.tab');if(tab){switchTab(tab.dataset.tab);return;}
  const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el);}
});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='fMonth'){ui.f.month=e.target.value;renderMain();}else if(id==='fCat'){ui.f.cat=e.target.value;renderMain();}else if(id==='fClient'){ui.f.client=e.target.value;renderMain();}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){ui.f.q=e.target.value;$('#hList').innerHTML=historyList();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&curSave&&e.target.matches('#panel input:not([type=date])')){e.preventDefault();curSave();}});
$('#impFile').addEventListener('change',onImport);

if(state.settings.pin)showLock('unlock');
renderMain();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
